spring.application.name=Backend

# H2 permite ejecutar el proyecto localmente sin instalar PostgreSQL.
# En otro entorno se pueden sobrescribir estas propiedades con DB_URL,
# DB_USERNAME y DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:h2:mem:turnoya;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

turnoya.data-file=${TURNOYA_DATA_FILE:../../data/turnos_hoy.xlsx}
