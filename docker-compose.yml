services:
  postgres:
    image: postgres:16-alpine
    container_name: turnoya-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-turnoya}
      POSTGRES_USER: ${POSTGRES_USER:-turnoya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-turnoya_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - turnoya-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  turnoya-postgres-data:
